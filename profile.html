<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">My Profile</h2>
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" id="profileTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="account-tab" data-bs-toggle="tab" data-bs-target="#account" type="button" role="tab">Account Settings</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="address-tab" data-bs-toggle="tab" data-bs-target="#address" type="button" role="tab">Address Book</button>
      </li>
    </ul>
    <!-- Tab content -->
    <div class="tab-content mt-4" id="profileTabsContent">
      <div class="tab-pane fade show active" id="account" role="tabpanel" aria-labelledby="account-tab">
        <h5><i class="bi bi-gear me-2"></i>Account Settings</h5>
        <p>Here you can update your username, email, and password.</p>
        <!-- Example form -->
        <form>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter new password">
          </div>
          <button type="submit" class="btn btn-primary">Update</button>
        </form>
      </div>

      <div class="tab-pane fade" id="address" role="tabpanel" aria-labelledby="address-tab">
        <h5><i class="bi bi-geo-alt me-2"></i>Address Book</h5>
        <p>Here you can manage your saved addresses.</p>
        <!-- Example address list -->
        <ul class="list-group">
          <li class="list-group-item">
            <strong>Home:</strong> 123 Main St,Chennai-600114.
          </li>
          <li class="list-group-item">
            <strong>Office:</strong> 456 Business Rd,Chennai.
          </li>
        </ul>
        <button class="btn btn-secondary mt-3">Add New Address</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
